name: Publish npm package

# npm Trusted Publishing (OIDC) — no npm token or account 2FA involved. Requires this exact
# repo + workflow file to be registered as a Trusted Publisher for the target package on
# npmjs.com (package Settings -> Trusted Publisher) before this can succeed.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        required: true
        type: choice
        options:
          - react-natives
          - react-natives-pro

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm OIDC trusted publishing
      contents: read # required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Publish
        working-directory: packages/${{ inputs.package }}
        run: npm publish --access public
